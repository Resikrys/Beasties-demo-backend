version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: beasties-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password_segura
      MYSQL_DATABASE: beasties_db
      MYSQL_USER: beasties_user
      MYSQL_PASSWORD: beasties_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  app:
    build: .
    container_name: beasties-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/beasties_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: beasties_user
      SPRING_DATASOURCE_PASSWORD: beasties_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  db_data: